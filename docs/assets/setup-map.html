<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Porunga current setup</title>
  <style>
    :root { --ink: #111; --muted: #444; --panel: #f7f7f7; --bg: #fff; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px 32px; background: var(--bg); color: var(--ink);
           font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    main { max-width: 1240px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin-bottom: 14px; }
    h1 { margin: 0; font-size: clamp(28px, 4.4vw, 52px); font-weight: 800; letter-spacing: -.02em; }
    .date { font: 15px ui-monospace, "Courier New", monospace; color: #999; white-space: nowrap; }
    svg { display: block; width: 100%; height: auto; }
    .panel { fill: var(--panel); }
    .box { fill: #fff; stroke: var(--ink); stroke-width: 1.6; }
    .t { font-size: 17px; font-weight: 700; fill: var(--ink); }
    .s { font-size: 12.5px; fill: var(--muted); }
    .lbl { font-size: 12.5px; fill: var(--ink); }
    .it { font-size: 12.5px; font-style: italic; fill: var(--ink); }
    .ln { stroke: var(--ink); stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .ic { fill: none; stroke: var(--ink); stroke-width: 1.6; }
    .foot { font-size: 12px; fill: #777; }
    @media (max-width: 600px) { body { padding: 16px; } }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Porunga — current setup</h1>
    <span class="date">november 2026</span>
  </header>

  <svg viewBox="0 0 1200 760" role="img" aria-labelledby="t d">
    <title id="t">Porunga current setup</title>
    <desc id="d">The operator reaches an always-on VPS through Hublot, Telegram or remote sessions. Scheduled systemd timers also run there. Hublot's Claude Router dispatches leased jobs to two peer agents, Jarvis (Claude) and Leo (Hermes, GPT lineage). Jarvis delegates execution to DeepSeek Flash with a Codex fallback. Code lives in a private GitHub repository, Jarvis memory in PostgreSQL with pgvector, doctrine in an Obsidian vault shared by both agents and mirrored nightly into Git.</desc>
    <defs>
      <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
        <path d="M0 0 L10 5 L0 10 z" fill="#111"/>
      </marker>
    </defs>

    <rect class="panel" x="20" y="10" width="1160" height="715" rx="18"/>

    <!-- ===== Row 1 ===== -->
    <!-- Operator -->
    <rect class="box" x="60" y="40" width="270" height="130" rx="8"/>
    <text class="t" x="195" y="68" text-anchor="middle">Operator</text>
    <!-- laptop -->
    <rect x="95" y="84" width="88" height="54" rx="4" fill="#1d1d1f"/>
    <path d="M84 140 h110 l-6 7 h-98 z" fill="#9a9a9e"/>
    <text class="s" x="139" y="162" text-anchor="middle">Laptop</text>
    <!-- phone -->
    <rect x="240" y="80" width="34" height="64" rx="6" fill="#1d1d1f"/>
    <text class="s" x="257" y="162" text-anchor="middle">Phone</text>

    <!-- VPS -->
    <rect class="box" x="450" y="30" width="300" height="150" rx="8"/>
    <rect x="545" y="48" width="110" height="26" rx="5" fill="#e9e9ec" stroke="#8a8a90"/>
    <rect x="545" y="80" width="110" height="26" rx="5" fill="#e9e9ec" stroke="#8a8a90"/>
    <circle cx="561" cy="61" r="3.5" fill="#2bb24c"/><circle cx="561" cy="93" r="3.5" fill="#2bb24c"/>
    <path d="M590 61 h50 M590 93 h50" stroke="#8a8a90" stroke-width="2"/>
    <text class="t" x="600" y="140" text-anchor="middle">VPS</text>
    <text class="s" x="600" y="160" text-anchor="middle">Always-on host · sole Porunga runtime</text>

    <!-- Scheduled tasks -->
    <rect class="box" x="850" y="40" width="290" height="130" rx="8"/>
    <g transform="translate(872,70)">
      <rect x="0" y="4" width="54" height="50" rx="5" fill="#fff" stroke="#2e7d32" stroke-width="2.4"/>
      <rect x="0" y="4" width="54" height="13" rx="4" fill="#2e7d32"/>
      <path d="M13 0 v10 M41 0 v10" stroke="#2e7d32" stroke-width="2.6" stroke-linecap="round"/>
      <g fill="#2e7d32"><rect x="7" y="23" width="8" height="7"/><rect x="19" y="23" width="8" height="7"/><rect x="31" y="23" width="8" height="7"/><rect x="7" y="35" width="8" height="7"/><rect x="19" y="35" width="8" height="7"/></g>
      <circle cx="48" cy="48" r="13" fill="#fff" stroke="#2e7d32" stroke-width="2.4"/>
      <path d="M48 41 v8 l5 3" stroke="#2e7d32" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    </g>
    <text class="t" x="1062" y="82" text-anchor="middle">Scheduled tasks</text>
    <text class="s" x="1062" y="104" text-anchor="middle">8 systemd timers</text>
    <text class="s" x="1062" y="122" text-anchor="middle">Brief · health · watchdogs</text>
    <text class="s" x="1062" y="140" text-anchor="middle">Verdicts to Discord</text>

    <!-- row 1 arrows -->
    <line class="ln" x1="330" y1="105" x2="446" y2="105" marker-end="url(#a)"/>
    <text class="lbl" x="388" y="86" text-anchor="middle">Hublot · Telegram</text>
    <text class="lbl" x="388" y="124" text-anchor="middle">remote sessions</text>
    <line class="ln" x1="850" y1="105" x2="754" y2="105" marker-end="url(#a)"/>

    <!-- ===== Row 2: Hublot ===== -->
    <line class="ln" x1="600" y1="180" x2="600" y2="216" marker-end="url(#a)"/>
    <rect class="box" x="330" y="220" width="540" height="70" rx="8"/>
    <g transform="translate(378,255)">
      <circle r="21" class="ic" stroke-width="3"/>
      <circle r="13" fill="#d8ecff" stroke="#111" stroke-width="1.6"/>
      <g fill="#111"><circle cx="0" cy="-17" r="1.8"/><circle cx="17" cy="0" r="1.8"/><circle cx="0" cy="17" r="1.8"/><circle cx="-17" cy="0" r="1.8"/></g>
    </g>
    <text class="t" x="625" y="250" text-anchor="middle">Hublot — Router on Claude Sonnet</text>
    <text class="s" x="625" y="272" text-anchor="middle">Private hub · leased jobs · human approval gate on external actions</text>

    <!-- split -->
    <path class="ln" d="M600 290 V312"/>
    <path class="ln" d="M600 312 H990 V346" marker-end="url(#a)"/>
    <line class="ln" x1="600" y1="312" x2="600" y2="346" marker-end="url(#a)"/>
    <text class="it" x="612" y="333">dispatches</text>
    <text class="it" x="1002" y="333">dispatches</text>

    <!-- ===== Row 3 ===== -->
    <!-- Engines -->
    <rect class="box" x="60" y="350" width="290" height="100" rx="8"/>
    <image href="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/deepseek.svg" x="76" y="370" width="30" height="30"/>
    <image href="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/openai.svg" x="76" y="406" width="28" height="28"/>
    <text class="t" x="230" y="380" text-anchor="middle">DeepSeek Flash</text>
    <text class="s" x="230" y="400" text-anchor="middle">Default execution engine</text>
    <text class="s" x="230" y="420" text-anchor="middle">Codex fallback on quota</text>
    <text class="s" x="230" y="438" text-anchor="middle">Never back to Claude</text>

    <!-- Jarvis -->
    <rect class="box" x="450" y="350" width="300" height="100" rx="8"/>
    <image href="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/claude-ai.svg" x="468" y="374" width="50" height="50"/>
    <text class="t" x="640" y="384" text-anchor="middle">Jarvis — Claude Opus</text>
    <text class="s" x="640" y="405" text-anchor="middle">Orchestrator · frames, delegates</text>
    <text class="s" x="640" y="423" text-anchor="middle">reviews diffs, runs the gates</text>

    <!-- Leo -->
    <rect class="box" x="850" y="350" width="290" height="100" rx="8"/>
    <image href="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/openai.svg" x="868" y="376" width="46" height="46"/>
    <text class="t" x="1030" y="384" text-anchor="middle">Leo — Hermes</text>
    <text class="s" x="1030" y="405" text-anchor="middle">GPT lineage · peer majordomo</text>
    <text class="s" x="1030" y="423" text-anchor="middle">Own sub-agents and memory</text>

    <!-- row 3 arrows -->
    <line class="ln" x1="450" y1="400" x2="354" y2="400" marker-end="url(#a)"/>
    <text class="it" x="400" y="390" text-anchor="middle">delegates</text>
    <line class="ln dash" x1="754" y1="400" x2="846" y2="400" marker-start="url(#a)" marker-end="url(#a)"/>
    <text class="it" x="800" y="390" text-anchor="middle">2nd opinion</text>

    <!-- vertical dashed -->
    <line class="ln dash" x1="205" y1="452" x2="205" y2="526" marker-end="url(#a)"/>
    <text class="it" x="217" y="494">Code sessions · PRs</text>
    <line class="ln dash" x1="600" y1="454" x2="600" y2="526" marker-start="url(#a)" marker-end="url(#a)"/>
    <text class="it" x="612" y="494">Recalled each prompt</text>
    <line class="ln dash" x1="995" y1="454" x2="995" y2="526" marker-start="url(#a)" marker-end="url(#a)"/>
    <text class="it" x="1007" y="494">Doctrine · notes</text>

    <!-- ===== Row 4 ===== -->
    <!-- GitHub -->
    <rect class="box" x="60" y="530" width="290" height="80" rx="8"/>
    <image href="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/github.svg" x="78" y="550" width="40" height="40"/>
    <text class="t" x="232" y="563" text-anchor="middle">Private GitHub repo</text>
    <text class="s" x="232" y="584" text-anchor="middle">Code · config · history (canon)</text>

    <!-- Memory -->
    <rect class="box" x="450" y="530" width="300" height="80" rx="8"/>
    <image href="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/postgres.svg" x="468" y="550" width="40" height="40"/>
    <text class="t" x="632" y="563" text-anchor="middle">PostgreSQL + pgvector</text>
    <text class="s" x="632" y="584" text-anchor="middle">Jarvis memory · local embeddings</text>

    <!-- Vault -->
    <rect class="box" x="850" y="530" width="290" height="80" rx="8"/>
    <image href="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/obsidian.svg" x="868" y="550" width="40" height="40"/>
    <text class="t" x="1022" y="563" text-anchor="middle">Obsidian vault</text>
    <text class="s" x="1022" y="584" text-anchor="middle">Shared by both agents · synced</text>

    <!-- bottom loop -->
    <path class="ln" d="M205 614 V680 H995 V614" marker-start="url(#a)"/>
    <rect x="478" y="669" width="244" height="22" fill="#f7f7f7"/>
    <text class="it" x="600" y="685" text-anchor="middle">Nightly mirror · vault → Git canon</text>

    <text class="foot" x="40" y="750">manin-porunga (this repository) is a curated public mirror — not deployed. Host identity, addresses and paths omitted.</text>
  </svg>
</main>
</body>
</html>
